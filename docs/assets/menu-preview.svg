<text x="30" y="671" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">7 — Отключить привязку Xray</text>
<text x="30" y="694" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">8 — Удалить профиль</text>
<text x="30" y="717" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">9 — Обновить движок Zapret2</text>
<text x="30" y="740" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">10 — Резервная копия</text>
<text x="30" y="763" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">11 — Полностью удалить менеджер</text>
<text x="30" y="786" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">0 — Выход</text>
<text x="30" y="809" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">r — Обновить статусы</text>
