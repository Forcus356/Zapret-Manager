<text x="30" y="579" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">3 — Start / Stop / Restart</text>
<text x="30" y="602" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">4 — Журнал</text>
<text x="30" y="625" xml:space="preserve" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#dde7f5">5 — Привязать Xray</text>
